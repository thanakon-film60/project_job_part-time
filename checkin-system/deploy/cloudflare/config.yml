# ===================================================================
# Cloudflare Tunnel config — โปรเจ็กต์ checkin-system (THANAKON-BOX)
#
# ปลายทาง: IIS พอร์ต 80 บนเครื่องนี้
#   IIS เสิร์ฟ React (static) + reverse proxy ไป uvicorn 127.0.0.1:8001
#   จึงได้ทั้งหน้าเว็บและ API อยู่ URL เดียวกัน (same-origin ไม่ต้องกังวล CORS)
#
# ใช้ได้ 3 โดเมน ชี้ที่เดียวกันหมด:
#   thanakronpart-time.com       (โดเมนหลัก)
#   www.thanakronpart-time.com
#   api.thanakronpart-time.com
#
# ⚠️ ไฟล์นี้เป็น config เดียวของ tunnel "Film_Part-Time" — ห้ามมีไฟล์ config
#    อื่นที่ใช้ tunnel ID เดียวกันรันพร้อมกันเด็ดขาด ถ้ามีสองตัวรันพร้อมกัน
#    Cloudflare จะสุ่มส่งคำขอไปหาทั้งคู่ ทำให้เว็บสลับไปมาระหว่างสองระบบ
#    มีแอปใหม่ที่อยากเปิดออกเน็ต ให้ "เพิ่ม ingress ในไฟล์นี้" ไม่ใช่สร้างไฟล์ใหม่
#
# วิธีใช้:
#   คัดลอกไฟล์นี้ไปวางเป็น F:\Game\config.yml แล้วสั่ง
#     .\cloudflared-windows-amd64.exe tunnel --config F:\Game\config.yml run Film_Part-Time
#   หรือใช้สคริปต์ setup-tunnel.ps1 ในโฟลเดอร์เดียวกันนี้
#
# 🔴 อย่าก๊อปไฟล์นี้ทับ config ของ production ตรง ๆ (ตรวจพบ 12 ก.ย. 2026)
#    Windows Service ชื่อ "Cloudflared" บนเครื่อง production ไม่ได้ใช้ F:\Game\config.yml
#    แต่ใช้  C:\ProgramData\Cloudflare\cloudflared\config.yml
#    และไฟล์นั้นชี้ credentials-file ไปคนละพาธกับไฟล์นี้ด้วย
#    ก๊อปทับ = tunnel หา credentials ไม่เจอ แล้วเว็บล่มทั้งระบบ
#
#    ดูว่าตัวจริงอยู่ไหน:
#      (Get-CimInstance Win32_Service -Filter "Name='Cloudflared'").PathName
#    เวลาจะแก้ ให้แก้ไฟล์ที่ service ใช้จริง แล้วค่อยเอาการเปลี่ยนแปลงมาลงไฟล์นี้ตาม
#
# ⚠️ ห้าม commit ไฟล์ credentials (.json) ขึ้น Git เด็ดขาด
# ===================================================================

tunnel: 1d37443e-8845-4c41-8c80-aa0f671ba280
credentials-file: C:\Users\Administrator\.cloudflared\1d37443e-8845-4c41-8c80-aa0f671ba280.json

# ให้ log อยู่ระดับ info (เปลี่ยนเป็น debug เวลาไล่ปัญหา)
loglevel: info
# เขียน log ลงไฟล์ เพื่อให้ไล่ปัญหาได้ตอนรันเป็น Windows Service
logfile: F:\Game\cloudflared.log

ingress:
  # ---------------------------------------------------------------
  # WebSocket ของห้องช่วยเหลือระยะไกล -> ตรงไป uvicorn :8001 ไม่ผ่าน IIS
  #
  # IIS ส่งต่อ WebSocket ได้ก็ต่อเมื่อเปิดฟีเจอร์ Web-WebSockets ซึ่งติดตั้งไว้แล้ว
  # แต่ค้างสถานะ "Enable Pending" รอ restart เครื่อง (12 ก.ย. 2026)
  # cloudflared รองรับ WebSocket ในตัวอยู่แล้ว จึงส่งเส้นนี้ตรงไป backend เลย
  # ได้ผลพลอยได้คือเร็วขึ้น เพราะตัดตัวกลางออกไปหนึ่งชั้น
  #
  # ⚠️ กฎที่มี path ต้องอยู่ "เหนือ" กฎ hostname เปล่า ๆ ของโดเมนเดียวกันเสมอ
  #    cloudflared ไล่กฎจากบนลงล่างแล้วหยุดที่กฎแรกที่ตรง ถ้าสลับลำดับกัน
  #    กฎ hostname จะรับไปก่อนและกฎนี้จะไม่มีวันถูกใช้เลย
  #
  # ความปลอดภัยไม่ได้ลดลงจากการข้าม IIS: backend ตรวจโทเค็นในลิงก์ห้องและ JWT
  # ของผู้ช่วยเองอยู่แล้ว (_authorize_ws ใน backend/app/routers/support.py)
  # เส้นทางอื่นทุกเส้นยังวิ่งผ่าน IIS เหมือนเดิม
  #
  # เอาขึ้น production ด้วย deploy\cloudflare\enable-support-websocket.ps1
  # (สคริปต์นั้นแก้ไฟล์ที่ service ใช้จริง ไม่ใช่ไฟล์นี้ — อ่านหมายเหตุสีแดงด้านบน)
  # ---------------------------------------------------------------
  - hostname: thanakronpart-time.com
    path: ^/support/ws/
    service: http://localhost:8001
    originRequest:
      connectTimeout: 30s

  - hostname: www.thanakronpart-time.com
    path: ^/support/ws/
    service: http://localhost:8001
    originRequest:
      connectTimeout: 30s

  - hostname: api.thanakronpart-time.com
    path: ^/support/ws/
    service: http://localhost:8001
    originRequest:
      connectTimeout: 30s

  # ---------------------------------------------------------------
  # ทั้ง 3 โดเมน -> IIS :80 (เว็บ + API)
  #
  # หมายเหตุ: cloudflared ไม่มีวิธี "รวมหลาย hostname ในกฎเดียว"
  #           ต้องเขียนแยกกันแบบนี้ ถ้าเพิ่มโดเมนใหม่ก็ก๊อปบล็อกไปเพิ่ม
  #           แล้วอย่าลืมสั่ง tunnel route dns ให้โดเมนนั้นด้วย
  # ---------------------------------------------------------------
  - hostname: thanakronpart-time.com
    service: http://localhost:80
    originRequest:
      # เขียน Host header เป็น localhost เพื่อให้ IIS site ที่ไม่ผูก hostname รับได้
      httpHostHeader: localhost
      # อัปโหลดรูปใบหน้าอาจใช้เวลา — ยืดเวลา connect/timeout เล็กน้อย
      connectTimeout: 30s
      noTLSVerify: true

  - hostname: www.thanakronpart-time.com
    service: http://localhost:80
    originRequest:
      httpHostHeader: localhost
      connectTimeout: 30s
      noTLSVerify: true

  - hostname: api.thanakronpart-time.com
    service: http://localhost:80
    originRequest:
      httpHostHeader: localhost
      connectTimeout: 30s
      noTLSVerify: true

  # ---------------------------------------------------------------
  # rider.thanakronpart-time.com -> แอป "บันทึกเส้นทางไรเดอร์" (คนละโปรเจ็กต์)
  #
  # แอปนั้นอยู่ที่ F:\GitHub\frontend_film_dev — FastAPI :8000 เสิร์ฟทั้งเว็บ
  # ที่ build แล้วและ API ในตัวเอง จึงชี้ตรงไป :8000 ไม่ผ่าน IIS
  # (เปิดแอปนั้นด้วย F:\GitHub\start-production.bat)
  #
  # ไม่ต้องใส่ httpHostHeader เพราะ FastAPI ไม่ได้ผูก host แบบ IIS
  # ---------------------------------------------------------------
  - hostname: rider.thanakronpart-time.com
    service: http://localhost:8000
    originRequest:
      connectTimeout: 30s

  # ---------------------------------------------------------------
  # ทุกอย่างที่เหลือ -> 404
  # ---------------------------------------------------------------
  - service: http_status:404
