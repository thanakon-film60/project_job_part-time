name: thanakon_box_boss
description: แอปหัวหน้า THANAKON-BOX (ดูทีม + ลงเวลาโดยไม่ต้องสแกนใบหน้า)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  geolocator: ^11.0.0
  shared_preferences: ^2.2.3
  flutter_background_service: ^5.0.5
  permission_handler: ^11.3.1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  # ฟังเสียงจากไมค์กล้อง CCTV — ตรึงไว้ที่สาย 0.9 ดูเหตุผลใต้หัวข้อ
  # "ตรึงเวอร์ชัน just_audio / audio_session" ด้านล่าง
  just_audio: 0.9.46

# ===================================================================
# ตรึงเวอร์ชัน path_provider_android
#
# flutter_map ต้องใช้ path_provider (ไว้หาที่เก็บ cache ของ tile แผนที่)
# แต่ path_provider_android 2.3.x เปลี่ยนไปเรียก native ผ่าน package jni
# ซึ่ง build ไม่ผ่านกับ Gradle/AGP ชุดที่โปรเจ็กต์นี้ใช้อยู่:
#   Could not determine the dependencies of task ':jni_flutter:compileReleaseJavaWithJavac'
# 2.2.23 เป็นตัวสุดท้ายก่อนเปลี่ยนไปใช้ jni และทำงานได้ครบเหมือนเดิม
# ถอดบรรทัดนี้ออกได้เมื่ออัปเกรด AGP/Gradle แล้วลอง build ผ่าน
# ===================================================================
# ===================================================================
# ตรึงเวอร์ชัน just_audio / audio_session
#
# ทั้งคู่ย้ายไปประกาศ agpVersion = "9.0.1" ในสคริปต์ build ของตัวเอง
# (just_audio ตั้งแต่ 0.10.x, audio_session ตั้งแต่ 0.2.x) ซึ่งชนกับ
# AGP ที่โปรเจ็กต์นี้ใช้ แล้ว build ไม่ผ่าน:
#   Could not determine the dependencies of task
#   ':just_audio:compileDebugJavaWithJavac'
# just_audio 0.9.46 ยังใช้ AGP 8.5.0 และ audio_session 0.1.25 เป็นตัว
# ท้ายสุดของสาย 0.1 (just_audio ยอมรับช่วง >=0.1.24 <0.3.0 อยู่แล้ว)
# ถอดการตรึงทั้งสองออกได้เมื่ออัปเกรด AGP เป็น 9 แล้วลอง build ผ่าน
# ===================================================================
dependency_overrides:
  path_provider_android: 2.2.23
  audio_session: 0.1.25

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # สร้างไอคอนแอปจากรูปเดียวกับเว็บ — ดูหัวข้อ flutter_launcher_icons ท้ายไฟล์
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo-checkin.png

# ===================================================================
# ไอคอนแอป (Android/iOS) — ใช้โลโก้ตัวเดียวกับเว็บ
#
#   assets/icon/app-icon.png            = frontend/public/logo-checkin.png วางบนพื้นขาว
#   assets/icon/app-icon-foreground.png = โลโก้เดิมย่อให้อยู่ในโซนปลอดภัยของ adaptive icon
#
# สร้างไฟล์ไอคอนจริงด้วย:
#     flutter pub get
#     dart run flutter_launcher_icons
# (deploy\windows-server\build-flutter-apk.ps1 เรียกให้อัตโนมัติอยู่แล้ว)
# ===================================================================
flutter_launcher_icons:
  android: true
  # ios/ ไม่ได้อยู่ใน repo นี้ (build เฉพาะ APK) — เปิดเป็น true ไม่ได้
  # ไม่งั้น flutter_launcher_icons จะล้มทั้งขั้นตอนตอนหาไฟล์ Icon-App-*.png ไม่เจอ
  # ถ้าจะทำ iOS: flutter create --platforms=ios . ก่อน แล้วค่อยเปลี่ยนเป็น true
  ios: false
  image_path: "assets/icon/app-icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app-icon-foreground.png"
  remove_alpha_ios: true
