<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + maximum-scale=1 : กันหน้าซูมเองตอนโฟกัสช่องกรอกบน iOS
         และให้เนื้อหาชนขอบจอเวลาเปิดแบบเต็มจอ (notch) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>MARDODI — ปฏิทินเข้างาน</title>
    <meta name="theme-color" content="#1565c0" />
    <meta name="description" content="ระบบเช็คอินเข้างานด้วย GPS และสแกนใบหน้า" />

    <!-- iOS ไม่อ่าน manifest เกือบทั้งหมด ต้องใส่ tag ของ Apple เองถึงจะ
         "Add to Home Screen" แล้วเปิดเต็มจอพร้อมไอคอนที่ถูกต้อง -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MARDODI" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
